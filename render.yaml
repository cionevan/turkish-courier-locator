services:
  - type: web
    name: turkish-courier-locator
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm rebuild sqlite3 --build-from-source && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
